<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 140" width="170" height="140" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5BFF"/>
      <stop offset="100%" stop-color="#00C2A8"/>
    </linearGradient>
  </defs>

  <g transform="translate(10,30)">
    <!-- back link (full length, representing the long URL) -->
    <rect x="0" y="42" width="92" height="36" rx="18"
          fill="none" stroke="#131A33" stroke-width="12"/>

    <!-- front link (short, cut off, representing the shortened URL) -->
    <path d="M 70 30
             a 18 18 0 0 1 18 -18
             h 20
             a 18 18 0 0 1 18 18
             v 24
             a 18 18 0 0 1 -18 18
             h -8"
          fill="none" stroke="url(#linkGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- speed / shorten flick -->
    <path d="M 118 22 L 138 12 M 118 34 L 145 28"
          stroke="#00C2A8" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
